<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx — Game Library</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:          #07070e;
            --surface:     #0e0d1c;
            --surface2:    #15132b;
            --border:      rgba(124,58,237,0.18);
            --violet:      #7c3aed;
            --violet-lt:   #a78bfa;
            --violet-glow: rgba(124,58,237,0.28);
            --text:        #f0eeff;
            --muted:       #7e7a9e;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Ambient orbs ── */
        .bg-orb {
            position: fixed; border-radius: 50%;
            filter: blur(130px); pointer-events: none; z-index: 0;
            animation: drift 20s ease-in-out infinite alternate;
        }
        .orb1 { width:600px;height:600px;background:rgba(124,58,237,0.12);top:-200px;left:-200px; }
        .orb2 { width:400px;height:400px;background:rgba(79,26,191,0.1); bottom:-150px;right:-150px;animation-delay:-8s; }
        .orb3 { width:300px;height:300px;background:rgba(167,139,250,0.07);top:40%;left:50%;animation-delay:-15s; }
        @keyframes drift {
            from { transform: translate(0,0) scale(1); }
            to   { transform: translate(25px,20px) scale(1.06); }
        }
        body::before {
            content:''; position:fixed; inset:0; pointer-events:none; z-index:0;
            background-image:
                linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
        }

        /* ══════════════════════════════════
           TOP NAV
        ══════════════════════════════════ */
        .top-nav {
            position: sticky; top: 0; z-index: 100;
            height: 64px;
            background: rgba(7,7,14,0.92);
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            padding: 0 32px;
            gap: 20px;
        }

        .nav-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem; font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, var(--violet-lt));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
            text-decoration: none;
            flex-shrink: 0;
            display: flex; flex-direction: column; line-height: 1;
        }
        .nav-logo span {
            font-size: 0.5rem; letter-spacing: 0.18em;
            color: var(--muted); -webkit-text-fill-color: var(--muted);
            text-transform: uppercase; font-family: 'DM Mono', monospace;
            font-weight: 400; margin-top: 2px;
        }

        .nav-search {
            flex: 1; max-width: 480px; margin: 0 auto;
            display: flex; align-items: center; gap: 10px;
            background: var(--surface2);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 9px 14px;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .nav-search:focus-within {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.1);
        }
        .nav-search svg { color: var(--muted); flex-shrink: 0; }
        .nav-search input {
            background: transparent; border: none; outline: none;
            color: var(--text); font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem; flex: 1; min-width: 0;
        }
        .nav-search input::placeholder { color: var(--muted); }
        .search-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem; color: var(--muted);
            background: rgba(124,58,237,0.12);
            border: 1px solid var(--border);
            border-radius: 4px; padding: 2px 6px; flex-shrink: 0;
        }

        .nav-right {
            display: flex; align-items: center; gap: 10px;
            flex-shrink: 0;
        }
        .nav-link {
            font-size: 0.8rem; color: var(--muted);
            text-decoration: none; font-weight: 500;
            padding: 6px 12px; border-radius: 7px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-link:hover { background: rgba(124,58,237,0.1); color: var(--text); }
        .nav-link.active { color: var(--violet-lt); }

        .nav-avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--violet);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.75rem; font-weight: 700; cursor: pointer;
            border: 2px solid rgba(167,139,250,0.3);
            transition: border-color 0.2s;
            position: relative;
        }
        .nav-avatar:hover { border-color: var(--violet-lt); }

        /* Avatar dropdown */
        .avatar-menu {
            position: absolute; top: calc(100% + 10px); right: 0;
            background: rgba(14,13,28,0.98);
            backdrop-filter: blur(16px);
            border: 1px solid var(--border);
            border-radius: 10px; padding: 6px;
            min-width: 160px;
            box-shadow: 0 16px 40px rgba(0,0,0,0.5);
            display: none; z-index: 200;
            animation: fadeUp 0.2s ease;
        }
        .nav-avatar:hover .avatar-menu { display: block; }
        .avatar-menu-item {
            padding: 8px 12px; font-size: 0.8rem; color: var(--muted);
            border-radius: 7px; cursor: pointer;
            transition: background 0.15s, color 0.15s;
        }
        .avatar-menu-item:hover { background: rgba(124,58,237,0.1); color: var(--text); }
        .avatar-menu-item.danger:hover { background: rgba(248,113,113,0.1); color: #f87171; }
        .avatar-menu-divider { height: 1px; background: var(--border); margin: 4px 0; }

        /* ══════════════════════════════════
           MAIN CONTENT
        ══════════════════════════════════ */
        .main-content {
            position: relative; z-index: 1;
            padding: 40px 32px 60px;
            max-width: 1600px; margin: 0 auto;
        }

        .library-header {
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease;
        }
        .library-title {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.6rem; font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 6px;
        }
        .library-sub {
            font-size: 0.85rem; color: var(--muted);
        }
        .library-sub strong { color: var(--violet-lt); }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ══════════════════════════════════
           GAMES GRID
        ══════════════════════════════════ */
        .games-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(185px, 1fr));
            gap: 18px;
        }

        .game-card {
            background: rgba(14,13,28,0.8);
            border: 1px solid var(--border);
            border-radius: 12px; overflow: hidden;
            cursor: pointer;
            transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
            animation: fadeUp 0.4s ease both;
            position: relative;
        }
        .game-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 50px rgba(124,58,237,0.3);
            border-color: var(--violet);
        }

        /* Stagger animation delays */
        .game-card:nth-child(1)  { animation-delay: 0.03s; }
        .game-card:nth-child(2)  { animation-delay: 0.06s; }
        .game-card:nth-child(3)  { animation-delay: 0.09s; }
        .game-card:nth-child(4)  { animation-delay: 0.12s; }
        .game-card:nth-child(5)  { animation-delay: 0.15s; }
        .game-card:nth-child(6)  { animation-delay: 0.18s; }
        .game-card:nth-child(7)  { animation-delay: 0.21s; }
        .game-card:nth-child(8)  { animation-delay: 0.24s; }
        .game-card:nth-child(n+9){ animation-delay: 0.27s; }

        .thumb-wrap {
            position: relative;
            aspect-ratio: 4/3;
            overflow: hidden;
            background: var(--surface2);
        }
        .thumb-wrap img {
            width: 100%; height: 100%;
            object-fit: cover;
            transition: transform 0.35s ease;
        }
        .game-card:hover .thumb-wrap img { transform: scale(1.06); }

        .thumb-placeholder {
            width: 100%; height: 100%;
            background: linear-gradient(135deg, #2d1470 0%, #15132b 100%);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Unbounded', sans-serif;
            font-size: 2.4rem; font-weight: 900;
            color: rgba(167,139,250,0.5);
            letter-spacing: -0.05em;
        }

        /* Play overlay */
        .play-overlay {
            position: absolute; inset: 0;
            background: rgba(124,58,237,0.65);
            display: flex; align-items: center; justify-content: center;
            opacity: 0;
            transition: opacity 0.25s ease;
            backdrop-filter: blur(3px);
        }
        .game-card:hover .play-overlay { opacity: 1; }
        .play-circle {
            width: 52px; height: 52px;
            background: rgba(255,255,255,0.95);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
            transform: scale(0.85);
            transition: transform 0.2s ease;
        }
        .game-card:hover .play-circle { transform: scale(1); }
        .play-circle svg { margin-left: 3px; }

        .game-info {
            padding: 11px 13px 13px;
        }
        .game-title-text {
            font-size: 0.83rem; font-weight: 600;
            color: var(--text);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }

        /* ══════════════════════════════════
           EMPTY / LOADING STATES
        ══════════════════════════════════ */
        .state-box {
            text-align: center;
            padding: 80px 20px;
            grid-column: 1/-1;
        }
        .state-icon {
            font-size: 3rem; margin-bottom: 16px;
            display: block; opacity: 0.5;
        }
        .state-title { font-size: 1rem; font-weight: 600; margin-bottom: 6px; }
        .state-sub { font-size: 0.8rem; color: var(--muted); line-height: 1.6; }

        .loading-dots {
            display: flex; gap: 8px; justify-content: center; margin-bottom: 12px;
        }
        .dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: var(--violet);
            animation: bounce 1s ease-in-out infinite;
        }
        .dot:nth-child(2) { animation-delay: 0.15s; }
        .dot:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce {
            0%,100% { transform: translateY(0); opacity:0.4; }
            50%      { transform: translateY(-8px); opacity:1; }
        }

        /* ══════════════════════════════════
           GAME VIEWER MODAL
        ══════════════════════════════════ */
        .game-modal {
            position: fixed; inset: 0; z-index: 500;
            display: flex; flex-direction: column;
            opacity: 0; pointer-events: none;
            transition: opacity 0.3s ease;
            background: #000;
        }
        .game-modal.open {
            opacity: 1; pointer-events: all;
        }

        .modal-header {
            height: 52px; flex-shrink: 0;
            background: rgba(7,7,14,0.98);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between;
            padding: 0 18px;
            position: relative; z-index: 1;
        }

        .modal-left {
            display: flex; align-items: center; gap: 12px;
        }
        .modal-nyx-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 0.85rem; font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--violet-lt));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .modal-separator { color: var(--border); }
        .modal-game-name {
            font-size: 0.85rem; font-weight: 600; color: var(--text);
        }

        .modal-controls {
            display: flex; gap: 7px;
        }
        .mc-btn {
            display: flex; align-items: center; gap: 5px;
            padding: 6px 11px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 6px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.73rem; font-weight: 500;
            cursor: pointer;
            transition: background 0.2s, border-color 0.2s;
        }
        .mc-btn:hover { background: rgba(124,58,237,0.12); border-color: var(--violet); }
        .mc-btn.mc-close {
            background: rgba(248,113,113,0.08);
            border-color: rgba(248,113,113,0.25);
            color: #f87171;
        }
        .mc-btn.mc-close:hover { background: rgba(248,113,113,0.18); }
        .mc-btn svg { width: 13px; height: 13px; flex-shrink: 0; }

        .game-iframe-wrap {
            flex: 1; position: relative;
        }

        /* Loading overlay for iframe */
        .iframe-loader {
            position: absolute; inset: 0;
            background: #07070e;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 16px; z-index: 5;
            transition: opacity 0.4s ease;
        }
        .iframe-loader.hidden { opacity: 0; pointer-events: none; }
        .loader-text {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem; color: var(--muted);
            letter-spacing: 0.1em;
        }

        #game-iframe {
            width: 100%; height: 100%;
            border: none;
            position: absolute; inset: 0;
        }

        /* ══════════════════════════════════
           FULL SCREEN LOADING OVERLAY
        ══════════════════════════════════ */
        #page-loader {
            position: fixed; inset: 0;
            background: var(--bg);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 16px;
            z-index: 9999;
        }
        .loader-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.6rem; font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--violet-lt));
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .loader-bar {
            width: 100px; height: 2px;
            background: var(--surface2); border-radius: 2px; overflow: hidden;
        }
        .loader-bar::after {
            content:''; display:block; width:50%; height:100%;
            background: var(--violet); border-radius: 2px;
            animation: slide 0.9s ease-in-out infinite alternate;
        }
        @keyframes slide {
            from { transform: translateX(-100%); }
            to   { transform: translateX(200%); }
        }

        /* Responsive */
        @media (max-width: 700px) {
            .main-content { padding: 24px 16px 40px; }
            .top-nav { padding: 0 16px; }
            .nav-search { display: none; }
            .modal-controls .mc-btn span { display: none; }
            .mc-btn { padding: 6px 8px; }
        }
    </style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>
<div class="bg-orb orb3"></div>

<!-- ── Page Loader ── -->
<div id="page-loader">
    <div class="loader-logo">Nyx</div>
    <div class="loader-bar"></div>
</div>

<!-- ══ TOP NAV ══ -->
<nav class="top-nav">
    <a class="nav-logo" href="home.html">
        Nyx
        <span>Game Library</span>
    </a>

    <div class="nav-search">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
        </svg>
        <input type="text" id="search-input" placeholder="Search games…" autocomplete="off">
        <span class="search-badge" id="search-badge">0</span>
    </div>

    <div class="nav-right">
        <a class="nav-link" href="home.html">Dashboard</a>
        <a class="nav-link active">Games</a>
        <div class="nav-avatar" id="nav-avatar">
            <span id="nav-initials">?</span>
            <div class="avatar-menu">
                <div class="avatar-menu-item" id="menu-username" style="font-weight:600;color:var(--text)">Loading…</div>
                <div class="avatar-menu-divider"></div>
                <div class="avatar-menu-item" onclick="window.location.href='home.html'">⬡ Dashboard</div>
                <div class="avatar-menu-divider"></div>
                <div class="avatar-menu-item danger" id="menu-logout">↩ Sign Out</div>
            </div>
        </div>
    </div>
</nav>

<!-- ══ MAIN CONTENT ══ -->
<div class="main-content">
    <div class="library-header">
        <div class="library-title">Game Library</div>
        <div class="library-sub">Welcome, <strong id="welcome-name">...</strong> — pick a game and play</div>
    </div>

    <div class="games-grid" id="games-grid">
        <!-- Loading state -->
        <div class="state-box" id="loading-state">
            <div class="loading-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="state-sub">Loading games…</div>
        </div>
    </div>
</div>

<!-- ══ GAME VIEWER MODAL ══ -->
<div class="game-modal" id="game-modal">
    <div class="modal-header">
        <div class="modal-left">
            <span class="modal-nyx-logo">Nyx</span>
            <span class="modal-separator">—</span>
            <span class="modal-game-name" id="modal-title">Game</span>
        </div>
        <div class="modal-controls">
            <button class="mc-btn" id="btn-fullscreen">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
                <span>Fullscreen</span>
            </button>
            <button class="mc-btn" id="btn-newtab">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><polyline points="15 3 21 3 21 9"/><line x1="10" y1="14" x2="21" y2="3"/></svg>
                <span>New Tab</span>
            </button>
            <button class="mc-btn" id="btn-download">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                <span>Download</span>
            </button>
            <button class="mc-btn mc-close" id="btn-close-modal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                <span>Close</span>
            </button>
        </div>
    </div>

    <div class="game-iframe-wrap">
        <div class="iframe-loader" id="iframe-loader">
            <div class="loading-dots">
                <div class="dot"></div><div class="dot"></div><div class="dot"></div>
            </div>
            <div class="loader-text">Loading game…</div>
        </div>
        <iframe id="game-iframe" allowfullscreen allow="fullscreen"></iframe>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, collection, getDocs, getDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey:            "AIzaSyAaRvkBoiZe2_h7tPsRYv3YmS487L09-H4",
        authDomain:        "nyx-platform1.firebaseapp.com",
        projectId:         "nyx-platform1",
        storageBucket:     "nyx-platform1.firebasestorage.app",
        messagingSenderId: "55921089818",
        appId:             "1:55921089818:web:6458294efcf6e6263260a3",
    };
    const app  = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    /* ── State ── */
    let allGames    = [];
    let currentGame = null; // { title, gameFileURL, thumbnailURL }

    /* ── Auth Check ── */
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }

        // Set nav user info
        const initials = (user.displayName || user.email).slice(0,2).toUpperCase();
        document.getElementById('nav-initials').textContent    = initials;
        document.getElementById('menu-username').textContent   = user.displayName || user.email.split('@')[0];
        document.getElementById('welcome-name').textContent    = user.displayName || user.email.split('@')[0];

        // Fetch user data from Firestore for username
        try {
            const snap = await getDoc(doc(db, 'users', user.uid));
            if (snap.exists()) {
                const uname = snap.data().username;
                document.getElementById('welcome-name').textContent  = uname;
                document.getElementById('menu-username').textContent = uname;
                document.getElementById('nav-initials').textContent  = uname.slice(0,2).toUpperCase();
            }
        } catch {}

        await loadGames();
        document.getElementById('page-loader').style.display = 'none';
    });

    /* ── Sign Out ── */
    document.getElementById('menu-logout').onclick = async () => {
        await signOut(auth);
        window.location.href = 'login.html';
    };

    /* ════════════════════════
       LOAD GAMES
    ════════════════════════ */
    async function loadGames() {
        try {
            const snap = await getDocs(query(collection(db, 'games'), orderBy('uploadedAt', 'desc')));
            allGames = [];
            snap.forEach(d => allGames.push({ id: d.id, ...d.data() }));
            renderGames(allGames);
        } catch (err) {
            console.error('Failed to load games:', err);
            showEmptyState('Could not load games.', 'Check your connection and refresh.');
        }
    }

    /* ════════════════════════
       RENDER GAMES
    ════════════════════════ */
    function renderGames(games) {
        const grid  = document.getElementById('games-grid');
        const badge = document.getElementById('search-badge');
        badge.textContent = games.length;

        grid.innerHTML = '';

        if (games.length === 0) {
            const isSearch = document.getElementById('search-input').value.trim() !== '';
            showEmptyState(
                isSearch ? 'No games found' : 'No games yet',
                isSearch ? 'Try a different search term.' : 'The admin hasn\'t uploaded any games yet.'
            );
            return;
        }

        games.forEach((game, idx) => {
            const card = document.createElement('div');
            card.className = 'game-card';
            card.style.animationDelay = `${Math.min(idx * 0.04, 0.3)}s`;

            const hasThumb = game.thumbnailURL && game.thumbnailURL.trim() !== '';
            const thumbHTML = hasThumb
                ? `<img src="${game.thumbnailURL}" alt="${game.title}" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">`
                : '';
            const placeholderStyle = hasThumb ? 'display:none;' : '';

            card.innerHTML = `
                <div class="thumb-wrap">
                    ${thumbHTML}
                    <div class="thumb-placeholder" style="${placeholderStyle}">
                        ${(game.title || '?')[0].toUpperCase()}
                    </div>
                    <div class="play-overlay">
                        <div class="play-circle">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="#7c3aed">
                                <polygon points="5 3 19 12 5 21 5 3"/>
                            </svg>
                        </div>
                    </div>
                </div>
                <div class="game-info">
                    <div class="game-title-text">${escHtml(game.title)}</div>
                </div>
            `;

            card.onclick = () => openGame(game);
            grid.appendChild(card);
        });
    }

    function showEmptyState(title, sub) {
        const grid = document.getElementById('games-grid');
        grid.innerHTML = `
            <div class="state-box">
                <span class="state-icon">🎮</span>
                <div class="state-title">${title}</div>
                <div class="state-sub">${sub}</div>
            </div>
        `;
        document.getElementById('search-badge').textContent = '0';
    }

    /* ════════════════════════
       SEARCH
    ════════════════════════ */
    document.getElementById('search-input').addEventListener('input', (e) => {
        const q = e.target.value.trim().toLowerCase();
        const filtered = q
            ? allGames.filter(g => g.title.toLowerCase().includes(q))
            : allGames;
        renderGames(filtered);
    });

    /* ════════════════════════
       OPEN GAME MODAL
    ════════════════════════ */
    function openGame(game) {
        currentGame = game;
        const modal  = document.getElementById('game-modal');
        const iframe = document.getElementById('game-iframe');
        const loader = document.getElementById('iframe-loader');

        document.getElementById('modal-title').textContent = game.title;

        // Show loader, clear iframe
        loader.classList.remove('hidden');
        iframe.src = '';

        // Open modal
        modal.classList.add('open');
        document.body.style.overflow = 'hidden';

        // Set iframe src after a tick (so loader is visible)
        setTimeout(() => {
            iframe.src = game.gameFileURL;
        }, 50);

        // Hide loader when iframe loads
        iframe.onload = () => {
            setTimeout(() => loader.classList.add('hidden'), 300);
        };
    }

    function closeModal() {
        const modal  = document.getElementById('game-modal');
        const iframe = document.getElementById('game-iframe');
        modal.classList.remove('open');
        document.body.style.overflow = '';
        setTimeout(() => { iframe.src = ''; }, 300);
        currentGame = null;
    }

    /* ── Modal Controls ── */
    document.getElementById('btn-close-modal').onclick = closeModal;

    document.getElementById('btn-fullscreen').onclick = () => {
        const iframe = document.getElementById('game-iframe');
        if (iframe.requestFullscreen)           iframe.requestFullscreen();
        else if (iframe.webkitRequestFullscreen) iframe.webkitRequestFullscreen();
        else if (iframe.mozRequestFullScreen)    iframe.mozRequestFullScreen();
    };

    document.getElementById('btn-newtab').onclick = () => {
        if (currentGame) window.open(currentGame.gameFileURL, '_blank');
    };

    document.getElementById('btn-download').onclick = async () => {
        if (!currentGame) return;
        const btn = document.getElementById('btn-download');
        btn.textContent = '…';
        try {
            const res  = await fetch(currentGame.gameFileURL);
            const blob = await res.blob();
            const url  = URL.createObjectURL(blob);
            const a    = document.createElement('a');
            a.href     = url;
            a.download = currentGame.title.replace(/\s+/g,'_') + '.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        } catch {
            // CORS fallback
            window.open(currentGame.gameFileURL, '_blank');
        } finally {
            btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Download</span>`;
        }
    };

    // Close modal on Escape
    document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape') closeModal();
    });

    /* ── Utility ── */
    function escHtml(str) {
        return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
</body>
</html>
