<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nyx — AI Chat</title>
    <meta name="description" content="Nyx — blazing-fast AI chat powered by Groq." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.1/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.2/html2pdf.bundle.min.js"></script>
    <script src="https://js.puter.com/v2/"></script>
    <link rel="stylesheet" href="css/styles.css" />
</head>

<body>
    <div class="app" id="app">
        <!-- ═══ Sidebar ═══ -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-top">
                <div class="logo">
                    <div class="logo-glyph">✦</div>
                    <span class="logo-text">Nyx</span>
                </div>
                <button class="icon-btn" id="sidebarClose" title="Close">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none">
                        <path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                            stroke-linejoin="round" />
                    </svg>
                </button>
            </div>

            <button class="new-chat-btn" id="newChatBtn">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                    <path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
                </svg>
                New chat
            </button>

            <!-- Usage -->
            <div class="usage-section">
                <div class="usage-row">
                    <span class="usage-dot" id="usageDot">●</span>
                    <span class="usage-text" id="usageLabel">0 / 30 req/min</span>
                </div>
                <div class="usage-track">
                    <div class="usage-fill" id="usageBar"></div>
                </div>
            </div>

            <!-- History -->
            <div class="history-section">
                <div class="history-head">History</div>
                <div class="history-list" id="historyList">
                    <div class="hist-empty">No chats yet</div>
                </div>
            </div>

            <div class="sidebar-bottom">
                <button class="sb-btn" id="exportBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3" stroke="currentColor"
                            stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Export
                </button>
                <button class="sb-btn" id="clearBtn">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none">
                        <path d="M3 6h18M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a2 2 0 012-2h4a2 2 0 012 2v2"
                            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                    </svg>
                    Clear
                </button>
            </div>
        </aside>

        <!-- ═══ Main ═══ -->
        <main class="main">
            <header class="topbar">
                <button class="icon-btn" id="sidebarOpen">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                        <path d="M3 12h18M3 6h18M3 18h18" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" />
                    </svg>
                </button>
                <span class="topbar-label" id="topbarLabel">Nyx</span>
            </header>

            <!-- Messages -->
            <div class="msgs-wrap" id="messagesContainer">
                <div class="msgs" id="messagesList">
                    <div class="welcome" id="welcomeScreen">
                        <div class="w-glyph">✦</div>
                        <h1 class="w-title">Nyx</h1>
                        <p class="w-sub">Your midnight AI companion</p>
                        <div class="w-chips">
                            <button class="w-chip" data-prompt="Explain quantum entanglement in simple terms">🔬 Quantum
                                physics</button>
                            <button class="w-chip" data-prompt="Write a Python FastAPI server with JWT auth">🐍 Python
                                server</button>
                            <button class="w-chip" data-prompt="Compare PostgreSQL vs MongoDB vs Redis in a table">📊
                                Compare databases</button>
                            <button class="w-chip" data-prompt="Write a haiku about artificial intelligence">✍️ AI
                                haiku</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Input Area -->
            <div class="input-area">
                <div class="input-box" id="inputBox">
                    <div class="input-left">
                        <button class="icon-btn action-btn" id="attachBtn" title="Actions">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                        </button>
                        <div class="attach-menu" id="attachMenu">
                            <button class="attach-opt"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <path
                                        d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48">
                                    </path>
                                </svg> Attach file</button>
                            <button class="attach-opt"><svg width="16" height="16" viewBox="0 0 24 24" fill="none"
                                    stroke="currentColor" stroke-width="2" stroke-linecap="round"
                                    stroke-linejoin="round">
                                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                                    <polyline points="21 15 16 10 5 21"></polyline>
                                </svg> Create image</button>
                        </div>
                        <button class="think-toggle" id="thinkToggle">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <circle cx="12" cy="12" r="5"></circle>
                                <line x1="12" y1="1" x2="12" y2="3"></line>
                                <line x1="12" y1="21" x2="12" y2="23"></line>
                                <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                                <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                                <line x1="1" y1="12" x2="3" y2="12"></line>
                                <line x1="21" y1="12" x2="23" y2="12"></line>
                                <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                                <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                            </svg>
                            <span id="thinkLabel">Think</span>
                        </button>
                    </div>

                    <textarea id="chatInput" class="chat-input" placeholder="Ask anything" rows="1"></textarea>

                    <div class="input-right">
                        <button class="icon-btn mic-btn" id="micBtn" title="Voice input">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path>
                                <path d="M19 10v2a7 7 0 0 1-14 0v-2"></path>
                                <line x1="12" y1="19" x2="12" y2="23"></line>
                                <line x1="8" y1="23" x2="16" y2="23"></line>
                            </svg>
                        </button>
                        <button class="waveform-btn" id="sendBtn" title="Send">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 10V14M7 8V16M11 6V18M15 8V16M19 10V14" />
                            </svg>
                        </button>
                        <button class="stop-btn" id="stopBtn" title="Stop" style="display:none">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
                                <rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor" />
                            </svg>
                        </button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- Auth Modal -->
    <div class="modal-overlay" id="authModal" style="display:none">
        <div class="modal-card" style="max-width:320px; width:100%;">
            <h3>Sign in to continue</h3>
            <div style="font-size:0.8rem; color:var(--t2); margin-bottom:16px;">New accounts start on the Free plan
                automatically.</div>

            <div style="display:flex; flex-direction:column; gap:10px; text-align:left;">
                <input type="email" id="authEmail" placeholder="Email address"
                    style="width:100%; padding:10px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--bg-3); color:var(--t1);" />
                <input type="text" id="authUsername" placeholder="Username (required)"
                    style="width:100%; padding:10px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--bg-3); color:var(--t1);" />
                <input type="password" id="authPassword" placeholder="Password"
                    style="width:100%; padding:10px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--bg-3); color:var(--t1);" />
            </div>

            <div style="display:flex; flex-direction:column; gap:8px; margin-top:20px;">
                <button onclick="QuotaManager.signIn('free')"
                    style="width:100%; padding:10px; border-radius:var(--r-sm); border:none; background:var(--accent); color:#fff; cursor:pointer; font-weight:500;">Sign
                    in / Create account</button>

                <div style="display:flex; align-items:center; gap:10px; margin:10px 0;">
                    <hr style="flex:1; border:none; border-top:1px solid var(--border);">
                    <span style="font-size:0.75rem; color:var(--t3);">or</span>
                    <hr style="flex:1; border:none; border-top:1px solid var(--border);">
                </div>

                <button onclick="QuotaManager.signIn('free')"
                    style="width:100%; padding:10px; border-radius:var(--r-sm); border:1px solid var(--border); background:var(--bg-1); color:var(--t1); cursor:pointer; font-weight:500; display:flex; align-items:center; justify-content:center; gap:8px;">
                    <svg width="18" height="18" viewBox="0 0 24 24">
                        <path fill="#4285F4"
                            d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" />
                        <path fill="#34A853"
                            d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" />
                        <path fill="#FBBC05"
                            d="M5.84 14.1c-.22-.66-.35-1.36-.35-2.1s.13-1.44.35-2.1V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l3.66-2.84z" />
                        <path fill="#EA4335"
                            d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z" />
                    </svg>
                    Sign in with Google
                </button>
            </div>
        </div>
    </div>

    <!-- Image Modal -->
    <div class="modal-overlay" id="imageModal" style="display:none">
        <div class="modal-img-wrap">
            <button class="modal-x"
                onclick="document.getElementById('imageModal').style.display='none'">&times;</button>
            <img id="imageModalImg" src="" alt="" />
        </div>
    </div>

    <!-- Export Modal -->
    <div class="modal-overlay" id="exportModal" style="display:none">
        <div class="modal-card">
            <h3>Export Chat</h3>
            <button class="export-btn" data-format="markdown">📄 Markdown</button>
            <button class="export-btn" data-format="json">📋 JSON</button>
            <button class="export-btn" data-format="pdf">📕 PDF</button>
            <button class="modal-cancel" id="exportModalClose">Cancel</button>
        </div>
    </div>

    <!-- Drop overlay -->
    <div class="drop-zone" id="dropOverlay">
        <div class="drop-inner">
            <p>Drop files here</p>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/ratelimit.js"></script>
    <script src="js/markdown.js"></script>
    <script src="js/chat.js"></script>
    <script src="js/sidebar.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
