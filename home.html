<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx - Home</title>
    <style>
        /* Same Home styling */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f13; color: #ffffff; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        h1 { color: #a275ff; margin: 0; }
        .btn-logout { background-color: #333; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }
        .btn-logout:hover { background-color: #555; }
        .status-card { background-color: #1a1a24; padding: 20px; border-radius: 10px; display: inline-block; }
        .tier { font-weight: bold; padding: 5px 10px; border-radius: 5px; }
        .tier.Free { background-color: #555; }
        .tier.Gold { background-color: #d4af37; color: black; }
        .tier.Diamond { background-color: #b9f2ff; color: black; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { text-align: left; padding: 12px; border-bottom: 1px solid #333; }
        th { background-color: #1a1a24; }
        select { background-color: #2a2a35; color: white; border: 1px solid #555; padding: 5px; border-radius: 4px; }
    </style>
</head>
<body>

<header>
    <h1>Nyx</h1>
    <button class="btn-logout" id="btn-logout">Log Out</button>
</header>

<main id="app-content">Loading...</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, getDoc, collection, getDocs, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG (Must match login.html)
    const firebaseConfig = {
  	  apiKey: "AIzaSyAaRvkBoiZe2_h7tPsRYv3YmS487L09-H4",
  	  authDomain: "nyx-platform1.firebaseapp.com",
  	  projectId: "nyx-platform1",
  	  storageBucket: "nyx-platform1.firebasestorage.app",
  	  messagingSenderId: "55921089818",
  	  appId: "1:55921089818:web:6458294efcf6e6263260a3",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    const contentDiv = document.getElementById('app-content');

    // Check who is logged in
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            if (user.email === 'charanthegoatt@gmail.com') {
                renderAdminPanel();
            } else {
                renderUserDashboard(user.uid);
            }
        } else {
            window.location.href = 'login.html'; // Kick them out if not logged in
        }
    });

    async function renderUserDashboard(uid) {
        // Fetch user data from database
        const userDoc = await getDoc(doc(db, "users", uid));
        if (userDoc.exists()) {
            const userData = userDoc.data();
            contentDiv.innerHTML = `
                <h2>Welcome back, ${userData.username}!</h2>
                <div class="status-card">
                    <p>Your Current Status:</p>
                    <span class="tier ${userData.tier}">${userData.tier} User</span>
                </div>
            `;
        }
    }

    async function renderAdminPanel() {
        // Fetch ALL users from database
        const querySnapshot = await getDocs(collection(db, "users"));
        
        let tableHTML = `
            <h2>Admin Dashboard</h2>
            <p>Welcome Charanthegoatt. Here are your users:</p>
            <table>
                <tr>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Subscription Tier</th>
                </tr>
        `;

        querySnapshot.forEach((doc) => {
            const user = doc.data();
            const uid = doc.id;
            tableHTML += `
                <tr>
                    <td>${user.username}</td>
                    <td>${user.email}</td>
                    <td>
                        <select onchange="updateUserTier('${uid}', this.value)">
                            <option value="Free" ${user.tier === 'Free' ? 'selected' : ''}>Free</option>
                            <option value="Gold" ${user.tier === 'Gold' ? 'selected' : ''}>Gold</option>
                            <option value="Diamond" ${user.tier === 'Diamond' ? 'selected' : ''}>Diamond</option>
                        </select>
                    </td>
                </tr>
            `;
        });

        tableHTML += `</table>`;
        contentDiv.innerHTML = tableHTML;
    }

    // Attach update function to window so the HTML select tag can use it
    window.updateUserTier = async function(uid, newTier) {
        try {
            await updateDoc(doc(db, "users", uid), {
                tier: newTier
            });
            alert(`User updated to ${newTier} tier.`);
        } catch (error) {
            alert("Error updating user: " + error.message);
        }
    };

    // Logout
    document.getElementById('btn-logout').onclick = () => {
        signOut(auth);
    };
</script>

</body>
</html>
