<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         #07070e;
            --surface:    #0e0d1c;
            --surface2:   #15132b;
            --border:     rgba(124,58,237,0.18);
            --violet:     #7c3aed;
            --violet-lt:  #a78bfa;
            --violet-glow: rgba(124,58,237,0.3);
            --text:       #f0eeff;
            --muted:      #7e7a9e;
            --gold:       #f5c843;
            --gold-bg:    rgba(245,200,67,0.12);
            --diamond:    #7dd3fc;
            --diamond-bg: rgba(125,211,252,0.12);
            --free-bg:    rgba(126,122,158,0.15);
            --error:      #f87171;
            --success:    #a78bfa;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        .bg-orb {
            position: fixed; border-radius: 50%;
            filter: blur(130px); pointer-events: none; z-index: 0;
        }
        .orb1 { width:600px;height:600px;background:rgba(124,58,237,0.12);top:-200px;left:-200px; }
        .orb2 { width:400px;height:400px;background:rgba(79,26,191,0.1);bottom:-150px;right:-150px; }

        body::before {
            content:''; position:fixed; inset:0;
            background-image:
                linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events:none; z-index:0;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed; left:0;top:0;bottom:0; width:220px;
            background: rgba(14,13,28,0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            padding: 28px 20px;
            z-index: 10;
        }

        .sidebar-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.4rem; font-weight: 900; letter-spacing: -0.03em;
            background: linear-gradient(135deg,#fff 30%,var(--violet-lt));
            -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
            margin-bottom: 40px;
        }

        .nav-label {
            font-size: 0.68rem; letter-spacing: 0.14em;
            text-transform: uppercase; color: var(--muted);
            font-family: 'DM Mono', monospace; margin-bottom: 10px;
        }

        .nav-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px; border-radius: 9px;
            color: var(--muted); font-size: 0.88rem; font-weight: 500;
            cursor: pointer; margin-bottom: 4px;
            transition: background 0.2s, color 0.2s;
            text-decoration: none;
        }
        .nav-item:hover  { background: rgba(124,58,237,0.1); color: var(--text); }
        .nav-item.active { background: rgba(124,58,237,0.18); color: var(--violet-lt); }
        .nav-icon { font-size:1rem; width:20px; text-align:center; }

        .sidebar-footer { margin-top: auto; }
        .user-pill {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 12px;
            background: var(--surface2); border-radius: 10px;
            border: 1px solid var(--border); margin-bottom: 10px;
        }
        .avatar {
            width: 32px; height: 32px; border-radius: 50%;
            background: var(--violet);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem; font-weight: 700; flex-shrink: 0;
        }
        .user-info { overflow: hidden; }
        .user-name  { font-size:0.82rem;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }
        .user-email { font-size:0.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis; }

        .btn-logout {
            width: 100%; padding: 9px;
            background: transparent; border: 1px solid var(--border);
            border-radius: 9px; color: var(--muted);
            font-family: 'DM Sans', sans-serif; font-size: 0.83rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn-logout:hover { background:rgba(248,113,113,0.08);color:#f87171;border-color:rgba(248,113,113,0.3); }

        /* ── Main ── */
        .main {
            margin-left: 220px;
            padding: 40px 40px 60px;
            position: relative; z-index: 1; min-height: 100vh;
        }

        .page-header { margin-bottom: 32px; animation: fadeUp 0.5s ease both; }
        .page-title { font-size:1.6rem;font-weight:700;letter-spacing:-0.02em;margin-bottom:4px; }
        .page-subtitle { font-size:0.88rem;color:var(--muted); }

        @keyframes fadeUp {
            from { opacity:0; transform:translateY(12px); }
            to   { opacity:1; transform:translateY(0); }
        }

        /* ── Cards grid ── */
        .grid { display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px;margin-bottom:32px; }

        .card {
            background: rgba(14,13,28,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px; padding: 24px;
            animation: fadeUp 0.5s ease both;
        }
        .card:nth-child(2) { animation-delay:0.07s; }
        .card:nth-child(3) { animation-delay:0.14s; }

        .card-label {
            font-size:0.72rem; text-transform:uppercase;
            letter-spacing:0.12em; color:var(--muted);
            font-family:'DM Mono',monospace; margin-bottom:14px;
        }

        /* ── Tier badges ── */
        .tier-badge {
            display:inline-flex;align-items:center;gap:6px;
            padding:6px 14px; border-radius:30px;
            font-size:0.82rem;font-weight:600;letter-spacing:0.05em;
        }
        .tier-badge.Free    { background:var(--free-bg);   color:var(--muted);   border:1px solid rgba(126,122,158,0.3); }
        .tier-badge.Gold    { background:var(--gold-bg);   color:var(--gold);    border:1px solid rgba(245,200,67,0.35); }
        .tier-badge.Diamond { background:var(--diamond-bg);color:var(--diamond); border:1px solid rgba(125,211,252,0.35); }

        /* ── Section cards ── */
        .section-card {
            background: rgba(14,13,28,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px; padding: 28px;
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease 0.2s both;
        }
        .section-title {
            font-size:1rem; font-weight:600; margin-bottom:18px;
            display:flex; align-items:center; gap:8px;
        }

        /* ── Form fields ── */
        .field { margin-bottom: 14px; }
        .field label {
            display:block; font-size:0.75rem; font-weight:500; color:var(--muted);
            letter-spacing:0.08em; text-transform:uppercase; margin-bottom:7px;
        }
        .field input, .field select {
            width:100%; max-width:380px; padding:10px 13px;
            background:var(--surface2); border:1px solid rgba(124,58,237,0.2);
            border-radius:8px; color:var(--text);
            font-family:'DM Sans',sans-serif; font-size:0.88rem; outline:none;
            transition:border-color 0.2s,box-shadow 0.2s;
        }
        .field input:focus, .field select:focus {
            border-color:var(--violet); box-shadow:0 0 0 3px rgba(124,58,237,0.12);
        }
        .field input::placeholder { color:#3d3a5a; }

        /* Full-width field variant */
        .field.full input, .field.full select { max-width:100%; }

        .btn-sm {
            padding:9px 20px; background:var(--violet); border:none;
            border-radius:8px; color:#fff; font-family:'DM Sans',sans-serif;
            font-size:0.85rem; font-weight:600; cursor:pointer;
            transition:background 0.2s,transform 0.1s;
        }
        .btn-sm:hover  { background:#6d28d9; transform:translateY(-1px); }
        .btn-sm:active { transform:translateY(0); }
        .btn-sm.secondary {
            background:transparent; border:1px solid var(--border); color:var(--muted);
        }
        .btn-sm.secondary:hover { background:rgba(124,58,237,0.1);color:var(--text);border-color:var(--violet); }
        .btn-sm.danger {
            background:rgba(248,113,113,0.1); border:1px solid rgba(248,113,113,0.25); color:#f87171;
        }
        .btn-sm.danger:hover { background:rgba(248,113,113,0.2); }

        .msg-inline {
            font-size:0.78rem; margin-top:10px; display:none;
        }
        .msg-inline.error   { color:var(--error); }
        .msg-inline.success { color:var(--violet-lt); }

        /* ── Admin table ── */
        .table-wrap { overflow-x:auto; border-radius:12px; border:1px solid var(--border); }
        table { width:100%;border-collapse:collapse;background:rgba(14,13,28,0.6);font-size:0.88rem; }
        thead th {
            background:var(--surface2); color:var(--muted);
            font-size:0.72rem; font-family:'DM Mono',monospace;
            letter-spacing:0.1em; text-transform:uppercase;
            padding:13px 16px; text-align:left; font-weight:500;
        }
        tbody td { padding:13px 16px; border-top:1px solid var(--border); vertical-align:middle; }
        tbody tr:hover { background:rgba(124,58,237,0.04); }
        .uid-cell { font-family:'DM Mono',monospace; font-size:0.72rem; color:var(--muted); }

        select.tier-select {
            background:var(--surface2); color:var(--text);
            border:1px solid var(--border); padding:5px 10px;
            border-radius:7px; font-family:'DM Sans',sans-serif;
            font-size:0.83rem; cursor:pointer;
            transition:border-color 0.2s; width:auto; max-width:none;
        }
        select.tier-select:focus { border-color:var(--violet); outline:none; }

        /* ── Stat pills ── */
        .stat-pill {
            display:inline-flex;align-items:center;gap:6px;
            padding:5px 12px; border-radius:20px;
            font-size:0.78rem; font-family:'DM Mono',monospace;
        }
        .stat-pill.violet { background:rgba(124,58,237,0.15);color:var(--violet-lt);border:1px solid rgba(124,58,237,0.3); }
        .stat-pill.gold   { background:var(--gold-bg);   color:var(--gold);    border:1px solid rgba(245,200,67,0.25); }
        .stat-pill.sky    { background:var(--diamond-bg);color:var(--diamond); border:1px solid rgba(125,211,252,0.25); }
        .stats-row { display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px; }

        /* ── Game upload section ── */
        .upload-zone {
            display: flex; gap: 16px; flex-wrap: wrap;
            align-items: flex-start; margin-bottom: 20px;
        }

        /* Thumbnail drop zone */
        .thumb-drop {
            width: 160px; height: 120px; flex-shrink: 0;
            border: 2px dashed rgba(124,58,237,0.3);
            border-radius: 10px; background: var(--surface2);
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer; transition: border-color 0.2s, background 0.2s;
            overflow: hidden; position: relative;
        }
        .thumb-drop:hover { border-color: var(--violet); background: rgba(124,58,237,0.06); }
        .thumb-drop input { position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%; }
        .thumb-drop img { width:100%;height:100%;object-fit:cover;display:none; }
        .thumb-drop .drop-hint { font-size:0.65rem;color:var(--muted);text-align:center;padding:8px; }
        .thumb-drop .drop-icon { font-size:1.5rem;margin-bottom:6px; }

        .upload-fields { flex: 1; min-width: 220px; }

        /* Progress bar */
        .progress-wrap {
            height: 4px; background: var(--surface2);
            border-radius: 2px; overflow: hidden; margin-top: 12px;
            display: none;
        }
        .progress-bar {
            height: 100%; background: var(--violet);
            border-radius: 2px; width: 0%;
            transition: width 0.3s;
        }

        /* Games admin list */
        .game-admin-item {
            display: flex; align-items: center; gap: 14px;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 10px; margin-bottom: 8px;
            background: rgba(21,19,43,0.5);
            animation: fadeUp 0.3s ease;
        }
        .game-admin-thumb {
            width: 72px; height: 54px; border-radius: 6px;
            object-fit: cover; flex-shrink: 0;
            background: var(--surface2);
        }
        .game-admin-thumb-placeholder {
            width: 72px; height: 54px; border-radius: 6px;
            background: linear-gradient(135deg, #2d1470, #15132b);
            display: flex; align-items: center; justify-content: center;
            font-family: 'Unbounded', sans-serif;
            font-size: 1.1rem; font-weight: 900;
            color: rgba(167,139,250,0.5); flex-shrink: 0;
        }
        .game-admin-info { flex: 1; min-width: 0; }
        .game-admin-title { font-weight:600; font-size:0.88rem; }
        .game-admin-date  { font-size:0.7rem;color:var(--muted);margin-top:2px; }

        /* ── Loading screen ── */
        #loading-screen {
            position:fixed;inset:0;background:var(--bg);
            display:flex;align-items:center;justify-content:center;
            z-index:100;flex-direction:column;gap:16px;
        }
        .loader-logo {
            font-family:'Unbounded',sans-serif;font-size:2rem;font-weight:900;
            background:linear-gradient(135deg,#fff 30%,var(--violet-lt));
            -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
        }
        .loader-bar {
            width:120px;height:3px;background:var(--surface2);border-radius:2px;overflow:hidden;
        }
        .loader-bar::after {
            content:'';display:block;width:50%;height:100%;background:var(--violet);
            border-radius:2px;animation:slide 1s ease-in-out infinite alternate;
        }
        @keyframes slide {
            from { transform:translateX(-100%); }
            to   { transform:translateX(200%); }
        }
    </style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<div id="loading-screen">
    <div class="loader-logo">Nyx</div>
    <div class="loader-bar"></div>
</div>

<!-- ══ SIDEBAR ══ -->
<nav class="sidebar">
    <div class="sidebar-logo">Nyx</div>
    <div class="nav-label">Menu</div>
    <a class="nav-item active" href="home.html">
        <span class="nav-icon">⬡</span> Dashboard
    </a>
    <a class="nav-item" href="games.html">
        <span class="nav-icon">🎮</span> Game Library
    </a>
    <div class="sidebar-footer">
        <div class="user-pill" id="sidebar-user">
            <div class="avatar" id="sidebar-avatar">?</div>
            <div class="user-info">
                <div class="user-name"  id="sidebar-name">...</div>
                <div class="user-email" id="sidebar-email">...</div>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout">↩ Sign Out</button>
    </div>
</nav>

<!-- ══ MAIN ══ -->
<main class="main" id="app-content"><!-- populated by JS --></main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
        getAuth, onAuthStateChanged, signOut,
        EmailAuthProvider, reauthenticateWithCredential, updatePassword
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import {
        getFirestore, doc, getDoc, collection, getDocs,
        updateDoc, setDoc, deleteDoc, query, orderBy
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
    import {
        getStorage, ref, uploadBytesResumable,
        getDownloadURL, deleteObject
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-storage.js";

    /* ── Firebase config ── */
    const firebaseConfig = {
        apiKey:            "AIzaSyAaRvkBoiZe2_h7tPsRYv3YmS487L09-H4",
        authDomain:        "nyx-platform1.firebaseapp.com",
        projectId:         "nyx-platform1",
        storageBucket:     "nyx-platform1.firebasestorage.app",
        messagingSenderId: "55921089818",
        appId:             "1:55921089818:web:6458294efcf6e6263260a3",
    };
    const app     = initializeApp(firebaseConfig);
    const auth    = getAuth(app);
    const db      = getFirestore(app);
    const storage = getStorage(app);

    const ADMIN_EMAIL = 'charanthegoatt@gmail.com';

    /* ── Auth state ── */
    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }

        const initials = (user.displayName || user.email).slice(0,2).toUpperCase();
        document.getElementById('sidebar-avatar').textContent = initials;
        document.getElementById('sidebar-name').textContent   = user.displayName || 'User';
        document.getElementById('sidebar-email').textContent  = user.email;

        if (user.email === ADMIN_EMAIL) {
            await renderAdmin(user);
        } else {
            await renderUser(user);
        }
        document.getElementById('loading-screen').style.display = 'none';
    });

    /* ════════════════════════
       USER DASHBOARD
    ════════════════════════ */
    async function renderUser(user) {
        const snap = await getDoc(doc(db, 'users', user.uid));
        const data = snap.exists() ? snap.data() : { username: user.displayName || 'User', tier: 'Free' };
        const tierEmoji = { Free:'·', Gold:'✦', Diamond:'◈' };
        const content = document.getElementById('app-content');

        content.innerHTML = `
            <div class="page-header">
                <div class="page-title">Welcome back, ${escHtml(data.username)} 👋</div>
                <div class="page-subtitle">Here's your account overview</div>
            </div>

            <div class="grid">
                <div class="card">
                    <div class="card-label">Current Plan</div>
                    <span class="tier-badge ${data.tier}">${tierEmoji[data.tier]||'·'} ${data.tier}</span>
                </div>
                <div class="card">
                    <div class="card-label">Account Email</div>
                    <div style="font-size:0.9rem;font-weight:500;color:var(--violet-lt)">${user.email}</div>
                </div>
                <div class="card">
                    <div class="card-label">Member Since</div>
                    <div style="font-size:0.9rem;font-weight:500">
                        ${new Date(user.metadata.creationTime).toLocaleDateString('en-US',{month:'short',year:'numeric'})}
                    </div>
                </div>
            </div>

            <div class="section-card">
                <div class="section-title">🔐 Change Password</div>
                <div class="field"><label>Current Password</label><input type="password" id="cur-pw" placeholder="••••••••"></div>
                <div class="field"><label>New Password</label><input type="password" id="new-pw" placeholder="••••••••"></div>
                <div class="field"><label>Confirm New</label><input type="password" id="conf-pw" placeholder="••••••••"></div>
                <button class="btn-sm" id="btn-change-pw">Update Password</button>
                <div id="pw-msg" class="msg-inline"></div>
            </div>
        `;

        document.getElementById('btn-change-pw').onclick = async () => {
            const curPw  = document.getElementById('cur-pw').value;
            const newPw  = document.getElementById('new-pw').value;
            const confPw = document.getElementById('conf-pw').value;
            const msg    = document.getElementById('pw-msg');
            const show   = (t,ty) => { msg.textContent=t;msg.className=`msg-inline ${ty}`;msg.style.display='block'; };
            if (!curPw||!newPw||!confPw) return show('Fill in all fields.','error');
            if (newPw!==confPw)          return show('New passwords do not match.','error');
            if (newPw.length<6)         return show('Password must be at least 6 characters.','error');
            try {
                await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email, curPw));
                await updatePassword(user, newPw);
                show('✓ Password updated!','success');
                ['cur-pw','new-pw','conf-pw'].forEach(id=>document.getElementById(id).value='');
            } catch(err) {
                show(err.code==='auth/wrong-password'?'Current password is incorrect.':err.message,'error');
            }
        };
    }

    /* ════════════════════════
       ADMIN DASHBOARD
    ════════════════════════ */
    async function renderAdmin(user) {
        document.getElementById('sidebar-name').textContent = 'Admin';
        const content = document.getElementById('app-content');

        const [userSnap, gameSnap] = await Promise.all([
            getDocs(collection(db, 'users')),
            getDocs(query(collection(db, 'games'), orderBy('uploadedAt', 'desc')))
        ]);

        const users = [];
        userSnap.forEach(d => users.push({ uid: d.id, ...d.data() }));
        const count = { Free:0, Gold:0, Diamond:0 };
        users.forEach(u => { count[u.tier]=(count[u.tier]||0)+1; });

        const games = [];
        gameSnap.forEach(d => games.push({ id: d.id, ...d.data() }));

        let userRows = users.map(u => `
            <tr>
                <td>
                    <div style="display:flex;align-items:center;gap:10px">
                        <div style="width:30px;height:30px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0">
                            ${(u.username||'?').slice(0,2).toUpperCase()}
                        </div>
                        <span style="font-weight:500">${escHtml(u.username||'—')}</span>
                    </div>
                </td>
                <td style="color:var(--muted)">${escHtml(u.email)}</td>
                <td class="uid-cell">${u.uid.slice(0,12)}…</td>
                <td>
                    <select class="tier-select" onchange="window.updateTier('${u.uid}',this.value,this)">
                        <option value="Free"    ${u.tier==='Free'   ?'selected':''}>Free</option>
                        <option value="Gold"    ${u.tier==='Gold'   ?'selected':''}>Gold</option>
                        <option value="Diamond" ${u.tier==='Diamond'?'selected':''}>Diamond</option>
                    </select>
                </td>
            </tr>
        `).join('');

        let gameListHTML = games.length === 0
            ? `<div style="text-align:center;padding:32px;color:var(--muted);font-size:0.85rem;">No games uploaded yet.</div>`
            : games.map(g => buildGameAdminItem(g)).join('');

        content.innerHTML = `
            <div class="page-header">
                <div class="page-title">Admin Dashboard</div>
                <div class="page-subtitle">Manage users, subscriptions, and the game library</div>
            </div>

            <div class="stats-row">
                <span class="stat-pill violet">⬡ ${users.length} Users</span>
                <span class="stat-pill gold">✦ ${count.Gold} Gold</span>
                <span class="stat-pill sky">◈ ${count.Diamond} Diamond</span>
                <span class="stat-pill violet">🎮 ${games.length} Games</span>
            </div>

            <!-- ── Admin Password ── -->
            <div class="section-card">
                <div class="section-title">🔐 Change Admin Password</div>
                <div style="display:flex;gap:12px;flex-wrap:wrap">
                    <div class="field" style="margin:0"><label>Current</label><input type="password" id="a-cur-pw" placeholder="••••••••"></div>
                    <div class="field" style="margin:0"><label>New</label><input type="password" id="a-new-pw" placeholder="••••••••"></div>
                    <div class="field" style="margin:0"><label>Confirm</label><input type="password" id="a-conf-pw" placeholder="••••••••"></div>
                </div>
                <button class="btn-sm" style="margin-top:14px" id="btn-admin-pw">Update Password</button>
                <div id="a-pw-msg" class="msg-inline"></div>
            </div>

            <!-- ── User Management ── -->
            <div class="section-card" style="padding:0;overflow:hidden">
                <div style="padding:20px 24px 16px;border-bottom:1px solid var(--border)">
                    <div class="section-title" style="margin:0">👥 User Management</div>
                </div>
                <div class="table-wrap" style="border:none;border-radius:0">
                    <table>
                        <thead><tr>
                            <th>User</th><th>Email</th><th>UID</th><th>Tier</th>
                        </tr></thead>
                        <tbody>${userRows}</tbody>
                    </table>
                </div>
            </div>

            <!-- ══════════════════════════════════════
                 GAME LIBRARY MANAGEMENT
            ══════════════════════════════════════ -->
            <div class="section-card">
                <div class="section-title">🎮 Upload New Game</div>

                <div class="upload-zone">
                    <!-- Thumbnail drop zone -->
                    <div class="thumb-drop" id="thumb-drop">
                        <input type="file" id="thumb-file" accept="image/*" title="">
                        <img id="thumb-preview" alt="">
                        <div class="drop-hint" id="drop-hint">
                            <div class="drop-icon">🖼️</div>
                            Click to add<br>thumbnail
                        </div>
                    </div>

                    <!-- Upload fields -->
                    <div class="upload-fields">
                        <div class="field full">
                            <label>Game Title</label>
                            <input type="text" id="game-title" placeholder="e.g. Brotato">
                        </div>
                        <div class="field full">
                            <label>Game HTML File</label>
                            <input type="file" id="game-file" accept=".html" style="max-width:100%;padding:7px 10px;cursor:pointer;">
                        </div>
                        <div id="upload-progress-wrap" class="progress-wrap">
                            <div class="progress-bar" id="upload-progress-bar"></div>
                        </div>
                        <div id="upload-status" class="msg-inline"></div>
                        <div style="display:flex;gap:10px;margin-top:12px;align-items:center">
                            <button class="btn-sm" id="btn-upload-game">⬆ Upload Game</button>
                            <button class="btn-sm secondary" id="btn-clear-form">Clear</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Uploaded games list -->
            <div class="section-card">
                <div class="section-title">📋 Uploaded Games <span style="font-family:'DM Mono',monospace;font-size:0.75rem;color:var(--muted);font-weight:400">(${games.length})</span></div>
                <div id="games-admin-list">${gameListHTML}</div>
            </div>
        `;

        /* ── Admin password change ── */
        document.getElementById('btn-admin-pw').onclick = async () => {
            const curPw  = document.getElementById('a-cur-pw').value;
            const newPw  = document.getElementById('a-new-pw').value;
            const confPw = document.getElementById('a-conf-pw').value;
            const msg    = document.getElementById('a-pw-msg');
            const show   = (t,ty) => { msg.textContent=t;msg.className=`msg-inline ${ty}`;msg.style.display='block'; };
            if (!curPw||!newPw||!confPw) return show('Fill in all fields.','error');
            if (newPw!==confPw)          return show('Passwords do not match.','error');
            if (newPw.length<6)         return show('At least 6 characters.','error');
            try {
                await reauthenticateWithCredential(user, EmailAuthProvider.credential(user.email,curPw));
                await updatePassword(user, newPw);
                show('✓ Password updated!','success');
                ['a-cur-pw','a-new-pw','a-conf-pw'].forEach(id=>document.getElementById(id).value='');
            } catch(err) {
                show(err.code==='auth/wrong-password'?'Current password incorrect.':err.message,'error');
            }
        };

        /* ── Thumbnail preview ── */
        document.getElementById('thumb-file').onchange = (e) => {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (ev) => {
                const preview = document.getElementById('thumb-preview');
                preview.src = ev.target.result;
                preview.style.display = 'block';
                document.getElementById('drop-hint').style.display = 'none';
            };
            reader.readAsDataURL(file);
        };

        /* ── Clear form ── */
        document.getElementById('btn-clear-form').onclick = clearUploadForm;

        /* ── Upload game ── */
        document.getElementById('btn-upload-game').onclick = uploadGame;
    }

    /* ── Upload game to Firebase Storage + Firestore ── */
    async function uploadGame() {
        const title     = (document.getElementById('game-title').value || '').trim();
        const thumbFile = document.getElementById('thumb-file').files[0];
        const gameFile  = document.getElementById('game-file').files[0];
        const statusEl  = document.getElementById('upload-status');
        const progWrap  = document.getElementById('upload-progress-wrap');
        const progBar   = document.getElementById('upload-progress-bar');

        const show = (t,ty) => { statusEl.textContent=t;statusEl.className=`msg-inline ${ty}`;statusEl.style.display='block'; };

        if (!title)    return show('Please enter a game title.','error');
        if (!gameFile) return show('Please select an HTML game file.','error');

        const gameId = `game_${Date.now()}`;
        progWrap.style.display = 'block';
        progBar.style.width    = '0%';
        show('Uploading…','success');

        try {
            let thumbURL  = '';
            let thumbPath = '';

            // 1. Upload thumbnail (if provided)
            if (thumbFile) {
                const ext  = thumbFile.name.split('.').pop();
                thumbPath  = `games/${gameId}/thumbnail.${ext}`;
                const tRef = ref(storage, thumbPath);
                await new Promise((res, rej) => {
                    const task = uploadBytesResumable(tRef, thumbFile);
                    task.on('state_changed',
                        snap => { progBar.style.width = (snap.bytesTransferred/snap.totalBytes*50)+'%'; },
                        rej, res
                    );
                });
                thumbURL = await getDownloadURL(tRef);
                progBar.style.width = '50%';
            }

            // 2. Upload game HTML file
            const gamePath = `games/${gameId}/game.html`;
            const gRef     = ref(storage, gamePath);
            await new Promise((res, rej) => {
                const task = uploadBytesResumable(gRef, gameFile);
                task.on('state_changed',
                    snap => {
                        const pct = snap.bytesTransferred/snap.totalBytes * 50;
                        progBar.style.width = (50 + pct) + '%';
                    },
                    rej, res
                );
            });
            const gameFileURL = await getDownloadURL(gRef);
            progBar.style.width = '100%';

            // 3. Save to Firestore
            await setDoc(doc(db, 'games', gameId), {
                title,
                thumbnailURL:  thumbURL,
                thumbnailPath: thumbPath,
                gameFileURL,
                gameFilePath:  gamePath,
                uploadedAt:    new Date().toISOString()
            });

            show('✓ Game uploaded successfully!', 'success');
            clearUploadForm();

            // Refresh games list
            const gameSnap = await getDocs(query(collection(db, 'games'), orderBy('uploadedAt', 'desc')));
            const games = [];
            gameSnap.forEach(d => games.push({ id: d.id, ...d.data() }));
            document.getElementById('games-admin-list').innerHTML =
                games.length === 0
                    ? `<div style="text-align:center;padding:32px;color:var(--muted);font-size:0.85rem;">No games uploaded yet.</div>`
                    : games.map(g => buildGameAdminItem(g)).join('');

            // Update counter
            const countEl = document.querySelector('.section-title span');
            if (countEl) countEl.textContent = `(${games.length})`;

        } catch(err) {
            show('Upload failed: ' + err.message, 'error');
            progWrap.style.display = 'none';
        }
    }

    function clearUploadForm() {
        document.getElementById('game-title').value    = '';
        document.getElementById('thumb-file').value    = '';
        document.getElementById('game-file').value     = '';
        document.getElementById('thumb-preview').src   = '';
        document.getElementById('thumb-preview').style.display = 'none';
        document.getElementById('drop-hint').style.display = 'flex';
        document.getElementById('upload-progress-wrap').style.display = 'none';
        document.getElementById('upload-status').style.display = 'none';
        document.getElementById('upload-progress-bar').style.width = '0%';
    }

    /* ── Build admin game list item ── */
    function buildGameAdminItem(game) {
        const date  = game.uploadedAt ? new Date(game.uploadedAt).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}) : '—';
        const thumb = game.thumbnailURL
            ? `<img class="game-admin-thumb" src="${game.thumbnailURL}" alt="">`
            : `<div class="game-admin-thumb-placeholder">${(game.title||'?')[0]}</div>`;
        return `
            <div class="game-admin-item" id="gai-${game.id}">
                ${thumb}
                <div class="game-admin-info">
                    <div class="game-admin-title">${escHtml(game.title)}</div>
                    <div class="game-admin-date">Uploaded ${date}</div>
                </div>
                <button class="btn-sm danger" onclick="window.deleteGame('${game.id}','${game.thumbnailPath||''}','${game.gameFilePath||''}')">Delete</button>
            </div>
        `;
    }

    /* ── Delete game ── */
    window.deleteGame = async (gameId, thumbPath, gamePath) => {
        if (!confirm('Delete this game? This cannot be undone.')) return;
        try {
            // Delete files from Storage
            if (thumbPath) {
                try { await deleteObject(ref(storage, thumbPath)); } catch {}
            }
            if (gamePath) {
                try { await deleteObject(ref(storage, gamePath)); } catch {}
            }
            // Delete Firestore doc
            await deleteDoc(doc(db, 'games', gameId));
            // Remove from UI
            const el = document.getElementById(`gai-${gameId}`);
            if (el) el.remove();
        } catch(err) {
            alert('Failed to delete: ' + err.message);
        }
    };

    /* ── Update user tier ── */
    window.updateTier = async (uid, newTier, sel) => {
        try {
            await updateDoc(doc(db, 'users', uid), { tier: newTier });
            sel.style.borderColor = '#a78bfa';
            setTimeout(() => { sel.style.borderColor = ''; }, 1200);
        } catch(err) { alert('Error: ' + err.message); }
    };

    /* ── Logout ── */
    document.getElementById('btn-logout').onclick = async () => {
        await signOut(auth);
        window.location.href = 'login.html';
    };

    /* ── Utility ── */
    function escHtml(str) {
        return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
</script>
</body>
</html>
