<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx — Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;700;900&family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg:         #07070e;
            --surface:    #0e0d1c;
            --surface2:   #15132b;
            --border:     rgba(124,58,237,0.18);
            --violet:     #7c3aed;
            --violet-lt:  #a78bfa;
            --violet-glow: rgba(124,58,237,0.3);
            --text:       #f0eeff;
            --muted:      #7e7a9e;
            --gold:       #f5c843;
            --gold-bg:    rgba(245,200,67,0.12);
            --diamond:    #7dd3fc;
            --diamond-bg: rgba(125,211,252,0.12);
            --free-bg:    rgba(126,122,158,0.15);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── Ambient ── */
        .bg-orb {
            position: fixed;
            border-radius: 50%;
            filter: blur(130px);
            pointer-events: none;
            z-index: 0;
        }
        .orb1 { width: 600px; height: 600px; background: rgba(124,58,237,0.12); top: -200px; left: -200px; }
        .orb2 { width: 400px; height: 400px; background: rgba(79,26,191,0.1);   bottom: -150px; right: -150px; }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(124,58,237,0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(124,58,237,0.03) 1px, transparent 1px);
            background-size: 48px 48px;
            pointer-events: none;
            z-index: 0;
        }

        /* ── Sidebar ── */
        .sidebar {
            position: fixed;
            left: 0; top: 0; bottom: 0;
            width: 220px;
            background: rgba(14,13,28,0.9);
            backdrop-filter: blur(20px);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 28px 20px;
            z-index: 10;
        }

        .sidebar-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.4rem;
            font-weight: 900;
            letter-spacing: -0.03em;
            background: linear-gradient(135deg, #fff 30%, var(--violet-lt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 40px;
        }

        .nav-label {
            font-size: 0.68rem;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            margin-bottom: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            border-radius: 9px;
            color: var(--muted);
            font-size: 0.88rem;
            font-weight: 500;
            cursor: pointer;
            margin-bottom: 4px;
            transition: background 0.2s, color 0.2s;
        }
        .nav-item:hover { background: rgba(124,58,237,0.1); color: var(--text); }
        .nav-item.active { background: rgba(124,58,237,0.18); color: var(--violet-lt); }
        .nav-icon { font-size: 1rem; width: 20px; text-align: center; }

        .sidebar-footer { margin-top: auto; }
        .user-pill {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 12px;
            background: var(--surface2);
            border-radius: 10px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
        }
        .avatar {
            width: 32px; height: 32px;
            border-radius: 50%;
            background: var(--violet);
            display: flex; align-items: center; justify-content: center;
            font-size: 0.8rem;
            font-weight: 700;
            flex-shrink: 0;
        }
        .user-info { overflow: hidden; }
        .user-name  { font-size: 0.82rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .user-email { font-size: 0.7rem; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .btn-logout {
            width: 100%;
            padding: 9px;
            background: transparent;
            border: 1px solid var(--border);
            border-radius: 9px;
            color: var(--muted);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.83rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center; gap: 7px;
            transition: background 0.2s, color 0.2s, border-color 0.2s;
        }
        .btn-logout:hover { background: rgba(248,113,113,0.08); color: #f87171; border-color: rgba(248,113,113,0.3); }

        /* ── Main content ── */
        .main {
            margin-left: 220px;
            padding: 40px 40px 60px;
            position: relative;
            z-index: 1;
            min-height: 100vh;
        }

        .page-header {
            margin-bottom: 32px;
            animation: fadeUp 0.5s ease both;
        }
        .page-title {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-bottom: 4px;
        }
        .page-subtitle { font-size: 0.88rem; color: var(--muted); }

        @keyframes fadeUp {
            from { opacity:0; transform: translateY(12px); }
            to   { opacity:1; transform: translateY(0); }
        }

        /* ── Cards grid ── */
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 32px; }

        .card {
            background: rgba(14,13,28,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            animation: fadeUp 0.5s ease both;
        }
        .card:nth-child(2) { animation-delay: 0.07s; }
        .card:nth-child(3) { animation-delay: 0.14s; }

        .card-label {
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 0.12em;
            color: var(--muted);
            font-family: 'DM Mono', monospace;
            margin-bottom: 14px;
        }
        .card-value {
            font-family: 'Unbounded', sans-serif;
            font-size: 1.4rem;
            font-weight: 700;
        }

        /* ── Tier badge ── */
        .tier-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.82rem;
            font-weight: 600;
            letter-spacing: 0.05em;
        }
        .tier-badge.Free    { background: var(--free-bg);    color: var(--muted);   border: 1px solid rgba(126,122,158,0.3); }
        .tier-badge.Gold    { background: var(--gold-bg);    color: var(--gold);    border: 1px solid rgba(245,200,67,0.35); }
        .tier-badge.Diamond { background: var(--diamond-bg); color: var(--diamond); border: 1px solid rgba(125,211,252,0.35); }

        /* ── Change password form (for users) ── */
        .section-card {
            background: rgba(14,13,28,0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 28px;
            margin-bottom: 20px;
            animation: fadeUp 0.5s ease 0.2s both;
        }
        .section-title {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 18px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 0.75rem;
            font-weight: 500;
            color: var(--muted);
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 7px;
        }
        .field input, .field select {
            width: 100%;
            max-width: 380px;
            padding: 10px 13px;
            background: var(--surface2);
            border: 1px solid rgba(124,58,237,0.2);
            border-radius: 8px;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            font-size: 0.88rem;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .field input:focus, .field select:focus {
            border-color: var(--violet);
            box-shadow: 0 0 0 3px rgba(124,58,237,0.12);
        }
        .field input::placeholder { color: #3d3a5a; }

        .btn-sm {
            padding: 9px 20px;
            background: var(--violet);
            border: none;
            border-radius: 8px;
            color: #fff;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn-sm:hover  { background: #6d28d9; transform: translateY(-1px); }
        .btn-sm:active { transform: translateY(0); }
        .btn-sm.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--muted);
        }
        .btn-sm.secondary:hover { background: rgba(124,58,237,0.1); color: var(--text); border-color: var(--violet); }

        .msg-inline {
            font-size: 0.78rem;
            margin-top: 10px;
            display: none;
        }
        .msg-inline.error   { color: #f87171; }
        .msg-inline.success { color: var(--violet-lt); }

        /* ── Admin table ── */
        .table-wrap {
            overflow-x: auto;
            border-radius: 12px;
            border: 1px solid var(--border);
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(14,13,28,0.6);
            font-size: 0.88rem;
        }
        thead th {
            background: var(--surface2);
            color: var(--muted);
            font-size: 0.72rem;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 13px 16px;
            text-align: left;
            font-weight: 500;
        }
        tbody td {
            padding: 13px 16px;
            border-top: 1px solid var(--border);
            vertical-align: middle;
        }
        tbody tr:hover { background: rgba(124,58,237,0.04); }

        .uid-cell {
            font-family: 'DM Mono', monospace;
            font-size: 0.72rem;
            color: var(--muted);
        }

        select.tier-select {
            background: var(--surface2);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 5px 10px;
            border-radius: 7px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.83rem;
            cursor: pointer;
            transition: border-color 0.2s;
            width: auto;
            max-width: none;
        }
        select.tier-select:focus { border-color: var(--violet); outline: none; }

        /* ── Stats bar (admin) ── */
        .stat-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.78rem;
            font-family: 'DM Mono', monospace;
        }
        .stat-pill.violet { background: rgba(124,58,237,0.15); color: var(--violet-lt); border: 1px solid rgba(124,58,237,0.3); }
        .stat-pill.gold   { background: var(--gold-bg);    color: var(--gold);    border: 1px solid rgba(245,200,67,0.25); }
        .stat-pill.sky    { background: var(--diamond-bg); color: var(--diamond); border: 1px solid rgba(125,211,252,0.25); }

        .stats-row { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }

        /* ── Loading skeleton ── */
        #loading-screen {
            position: fixed; inset: 0; background: var(--bg);
            display: flex; align-items: center; justify-content: center;
            z-index: 100; flex-direction: column; gap: 16px;
        }
        .loader-logo {
            font-family: 'Unbounded', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #fff 30%, var(--violet-lt));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .loader-bar {
            width: 120px; height: 3px;
            background: var(--surface2);
            border-radius: 2px;
            overflow: hidden;
        }
        .loader-bar::after {
            content: '';
            display: block;
            width: 50%;
            height: 100%;
            background: var(--violet);
            border-radius: 2px;
            animation: slide 1s ease-in-out infinite alternate;
        }
        @keyframes slide {
            from { transform: translateX(-100%); }
            to   { transform: translateX(200%); }
        }
    </style>
</head>
<body>

<div class="bg-orb orb1"></div>
<div class="bg-orb orb2"></div>

<!-- Loading screen -->
<div id="loading-screen">
    <div class="loader-logo">Nyx</div>
    <div class="loader-bar"></div>
</div>

<!-- Sidebar -->
<nav class="sidebar">
    <div class="sidebar-logo">Nyx</div>
    <div class="nav-label">Menu</div>
    <div class="nav-item active">
        <span class="nav-icon">⬡</span> Dashboard
    </div>
    <div class="nav-item" id="nav-settings" style="display:none">
        <span class="nav-icon">⚙</span> Settings
    </div>
    <div class="sidebar-footer">
        <div class="user-pill" id="sidebar-user">
            <div class="avatar" id="sidebar-avatar">?</div>
            <div class="user-info">
                <div class="user-name" id="sidebar-name">...</div>
                <div class="user-email" id="sidebar-email">...</div>
            </div>
        </div>
        <button class="btn-logout" id="btn-logout">
            <span>↩</span> Sign Out
        </button>
    </div>
</nav>

<!-- Main -->
<main class="main" id="app-content">
    <!-- Populated by JS -->
</main>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import {
        getAuth, onAuthStateChanged, signOut,
        EmailAuthProvider, reauthenticateWithCredential, updatePassword
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import {
        getFirestore, doc, getDoc, collection, getDocs, updateDoc
    } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAaRvkBoiZe2_h7tPsRYv3YmS487L09-H4",
        authDomain: "nyx-platform1.firebaseapp.com",
        projectId: "nyx-platform1",
        storageBucket: "nyx-platform1.firebasestorage.app",
        messagingSenderId: "55921089818",
        appId: "1:55921089818:web:6458294efcf6e6263260a3",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db   = getFirestore(app);

    const ADMIN_EMAIL = 'charanthegoatt@gmail.com';

    onAuthStateChanged(auth, async (user) => {
        if (!user) { window.location.href = 'login.html'; return; }

        // Populate sidebar
        const initials = (user.displayName || user.email).slice(0,2).toUpperCase();
        document.getElementById('sidebar-avatar').textContent  = initials;
        document.getElementById('sidebar-name').textContent    = user.displayName || 'User';
        document.getElementById('sidebar-email').textContent   = user.email;

        if (user.email === ADMIN_EMAIL) {
            await renderAdmin();
        } else {
            document.getElementById('nav-settings').style.display = 'flex';
            await renderUser(user);
        }

        document.getElementById('loading-screen').style.display = 'none';
    });

    // ───────────────────────────────────────────────
    // USER DASHBOARD
    // ───────────────────────────────────────────────
    async function renderUser(user) {
        const snap = await getDoc(doc(db, "users", user.uid));
        const data = snap.exists() ? snap.data() : { username: user.displayName || 'User', tier: 'Free' };

        const tierEmoji = { Free: '·', Gold: '✦', Diamond: '◈' };
        const content   = document.getElementById('app-content');

        content.innerHTML = `
            <div class="page-header">
                <div class="page-title">Welcome back, ${data.username} 👋</div>
                <div class="page-subtitle">Here's your account overview</div>
            </div>

            <div class="grid">
                <div class="card">
                    <div class="card-label">Current Plan</div>
                    <div>
                        <span class="tier-badge ${data.tier}">${tierEmoji[data.tier] || '·'} ${data.tier}</span>
                    </div>
                </div>
                <div class="card">
                    <div class="card-label">Account Email</div>
                    <div style="font-size:0.9rem;font-weight:500;color:var(--violet-lt)">${user.email}</div>
                </div>
                <div class="card">
                    <div class="card-label">Member Since</div>
                    <div style="font-size:0.9rem;font-weight:500">${new Date(user.metadata.creationTime).toLocaleDateString('en-US',{month:'short',year:'numeric'})}</div>
                </div>
            </div>

            <!-- Change Password -->
            <div class="section-card">
                <div class="section-title">🔐 Change Password</div>
                <div class="field">
                    <label>Current Password</label>
                    <input type="password" id="cur-pw" placeholder="••••••••">
                </div>
                <div class="field">
                    <label>New Password</label>
                    <input type="password" id="new-pw" placeholder="••••••••">
                </div>
                <div class="field">
                    <label>Confirm New Password</label>
                    <input type="password" id="conf-pw" placeholder="••••••••">
                </div>
                <button class="btn-sm" id="btn-change-pw">Update Password</button>
                <div id="pw-msg" class="msg-inline"></div>
            </div>
        `;

        // Change password logic
        document.getElementById('btn-change-pw').onclick = async () => {
            const curPw  = document.getElementById('cur-pw').value;
            const newPw  = document.getElementById('new-pw').value;
            const confPw = document.getElementById('conf-pw').value;
            const msg    = document.getElementById('pw-msg');

            const show = (txt, type) => { msg.textContent = txt; msg.className = `msg-inline ${type}`; msg.style.display = 'block'; };

            if (!curPw || !newPw || !confPw) return show('Fill in all fields.', 'error');
            if (newPw !== confPw)             return show('New passwords do not match.', 'error');
            if (newPw.length < 6)            return show('Password must be at least 6 characters.', 'error');

            try {
                const cred = EmailAuthProvider.credential(user.email, curPw);
                await reauthenticateWithCredential(user, cred);
                await updatePassword(user, newPw);
                show('✓ Password updated successfully!', 'success');
                document.getElementById('cur-pw').value = '';
                document.getElementById('new-pw').value = '';
                document.getElementById('conf-pw').value = '';
            } catch (err) {
                show(err.code === 'auth/wrong-password' ? 'Current password is incorrect.' : err.message, 'error');
            }
        };
    }

    // ───────────────────────────────────────────────
    // ADMIN DASHBOARD
    // ───────────────────────────────────────────────
    async function renderAdmin() {
        const snap  = await getDocs(collection(db, "users"));
        const users = [];
        snap.forEach(d => users.push({ uid: d.id, ...d.data() }));

        const count = { Free: 0, Gold: 0, Diamond: 0 };
        users.forEach(u => { count[u.tier] = (count[u.tier] || 0) + 1; });

        const content = document.getElementById('app-content');
        document.getElementById('sidebar-name').textContent = 'Admin';

        let rows = users.map(u => `
            <tr>
                <td>
                    <div style="display:flex;align-items:center;gap:10px">
                        <div style="width:30px;height:30px;border-radius:50%;background:var(--violet);display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;flex-shrink:0">
                            ${(u.username||'?').slice(0,2).toUpperCase()}
                        </div>
                        <span style="font-weight:500">${u.username || '—'}</span>
                    </div>
                </td>
                <td style="color:var(--muted)">${u.email}</td>
                <td class="uid-cell">${u.uid.slice(0,12)}…</td>
                <td>
                    <select class="tier-select" onchange="window.updateTier('${u.uid}', this.value, this)">
                        <option value="Free"    ${u.tier==='Free'    ? 'selected':''}>Free</option>
                        <option value="Gold"    ${u.tier==='Gold'    ? 'selected':''}>Gold</option>
                        <option value="Diamond" ${u.tier==='Diamond' ? 'selected':''}>Diamond</option>
                    </select>
                </td>
            </tr>
        `).join('');

        content.innerHTML = `
            <div class="page-header">
                <div class="page-title">Admin Dashboard</div>
                <div class="page-subtitle">Manage all Nyx users and subscriptions</div>
            </div>

            <div class="stats-row">
                <span class="stat-pill violet">⬡ ${users.length} Total Users</span>
                <span class="stat-pill gold">✦ ${count.Gold} Gold</span>
                <span class="stat-pill sky">◈ ${count.Diamond} Diamond</span>
            </div>

            <!-- Change Admin Password -->
            <div class="section-card">
                <div class="section-title">🔐 Change Your Password</div>
                <div style="display:flex;gap:12px;flex-wrap:wrap">
                    <div class="field" style="margin:0">
                        <label>Current Password</label>
                        <input type="password" id="a-cur-pw" placeholder="••••••••">
                    </div>
                    <div class="field" style="margin:0">
                        <label>New Password</label>
                        <input type="password" id="a-new-pw" placeholder="••••••••">
                    </div>
                    <div class="field" style="margin:0">
                        <label>Confirm New</label>
                        <input type="password" id="a-conf-pw" placeholder="••••••••">
                    </div>
                </div>
                <button class="btn-sm" style="margin-top:14px" id="btn-admin-pw">Update Password</button>
                <div id="a-pw-msg" class="msg-inline"></div>
            </div>

            <div class="section-card" style="padding:0;overflow:hidden">
                <div style="padding:20px 24px 16px;border-bottom:1px solid var(--border)">
                    <div class="section-title" style="margin:0">👥 User Management</div>
                </div>
                <div class="table-wrap" style="border:none;border-radius:0">
                    <table>
                        <thead>
                            <tr>
                                <th>User</th>
                                <th>Email</th>
                                <th>UID</th>
                                <th>Tier</th>
                            </tr>
                        </thead>
                        <tbody>${rows}</tbody>
                    </table>
                </div>
            </div>
        `;

        // Admin change password
        document.getElementById('btn-admin-pw').onclick = async () => {
            const user   = auth.currentUser;
            const curPw  = document.getElementById('a-cur-pw').value;
            const newPw  = document.getElementById('a-new-pw').value;
            const confPw = document.getElementById('a-conf-pw').value;
            const msg    = document.getElementById('a-pw-msg');
            const show   = (txt, type) => { msg.textContent = txt; msg.className = `msg-inline ${type}`; msg.style.display = 'block'; };

            if (!curPw || !newPw || !confPw) return show('Fill in all fields.', 'error');
            if (newPw !== confPw)             return show('New passwords do not match.', 'error');
            if (newPw.length < 6)            return show('Password must be at least 6 characters.', 'error');

            try {
                const cred = EmailAuthProvider.credential(user.email, curPw);
                await reauthenticateWithCredential(user, cred);
                await updatePassword(user, newPw);
                show('✓ Password updated successfully!', 'success');
                ['a-cur-pw','a-new-pw','a-conf-pw'].forEach(id => document.getElementById(id).value = '');
            } catch (err) {
                show(err.code === 'auth/wrong-password' ? 'Current password is incorrect.' : err.message, 'error');
            }
        };
    }

    // Update tier from admin
    window.updateTier = async (uid, newTier, selectEl) => {
        try {
            await updateDoc(doc(db, "users", uid), { tier: newTier });
            // Flash feedback on the select
            selectEl.style.borderColor = '#a78bfa';
            setTimeout(() => { selectEl.style.borderColor = ''; }, 1200);
        } catch (err) {
            alert('Error: ' + err.message);
        }
    };

    // Logout
    document.getElementById('btn-logout').onclick = async () => {
        await signOut(auth);
        window.location.href = 'login.html';
    };
</script>
</body>
</html>
