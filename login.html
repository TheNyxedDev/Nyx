<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyx - Secure Login</title>
    <style>
        /* Same Nyx dark theme as before */
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0f0f13; color: #ffffff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .container { background-color: #1a1a24; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); width: 300px; text-align: center; }
        h1 { margin-top: 0; color: #a275ff; }
        input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #333; border-radius: 5px; background-color: #2a2a35; color: white; }
        button { width: 100%; padding: 10px; background-color: #a275ff; color: white; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #8b5cf6; }
        .toggle-text { margin-top: 15px; font-size: 0.9em; color: #aaa; cursor: pointer; }
        .toggle-text:hover { color: white; }
        #signup-section { display: none; }
        .error { color: #ff5c5c; font-size: 0.8em; margin-top: 5px; display: none;}
        .message { color: #a275ff; font-size: 0.8em; margin-top: 5px; display: none;}
    </style>
</head>
<body>

<div class="container">
    <h1>Nyx</h1>
    
    <div id="login-section">
        <h2>Login</h2>
        <input type="email" id="login-email" placeholder="Email" required>
        <input type="password" id="login-password" placeholder="Password" required>
        <div id="login-message" class="error"></div>
        <button id="btn-login">Log In</button>
        <div class="toggle-text" id="toggle-to-signup">Need an account? Sign Up</div>
    </div>

    <div id="signup-section">
        <h2>Sign Up</h2>
        <input type="email" id="signup-email" placeholder="Email" required>
        <input type="text" id="signup-username" placeholder="Username" required>
        <input type="password" id="signup-password" placeholder="Password" required>
        <input type="password" id="signup-confirm" placeholder="Confirm Password" required>
        <div id="signup-message" class="error"></div>
        <button id="btn-signup">Create Account</button>
        <div class="toggle-text" id="toggle-to-login">Already have an account? Log In</div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendEmailVerification, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
    import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
  	apiKey: "AIzaSyAaRvkBoiZe2_h7tPsRYv3YmS487L09-H4",
  	authDomain: "nyx-platform1.firebaseapp.com",
  	projectId: "nyx-platform1",
  	storageBucket: "nyx-platform1.firebasestorage.app",
  	messagingSenderId: "55921089818",
  	appId: "1:55921089818:web:6458294efcf6e6263260a3",
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Toggle Forms
    document.getElementById('toggle-to-signup').onclick = () => {
        document.getElementById('login-section').style.display = 'none';
        document.getElementById('signup-section').style.display = 'block';
    };
    document.getElementById('toggle-to-login').onclick = () => {
        document.getElementById('signup-section').style.display = 'none';
        document.getElementById('login-section').style.display = 'block';
    };

    // Sign Up Logic
    document.getElementById('btn-signup').onclick = async () => {
        const email = document.getElementById('signup-email').value;
        const username = document.getElementById('signup-username').value;
        const password = document.getElementById('signup-password').value;
        const confirm = document.getElementById('signup-confirm').value;
        const msgDiv = document.getElementById('signup-message');

        if (password !== confirm) {
            msgDiv.innerText = "Passwords do not match."; msgDiv.style.display = "block"; return;
        }

        try {
            // 1. Create the user in Firebase Auth
            const userCredential = await createUserWithEmailAndPassword(auth, email, password);
            const user = userCredential.user;

            // 2. Send verification email
            await sendEmailVerification(user);

            // 3. Save username and Free tier to Firestore Database
            await setDoc(doc(db, "users", user.uid), {
                email: email,
                username: username,
                tier: 'Free'
            });

            // Log them out and tell them to verify
            await signOut(auth);
            msgDiv.style.color = '#a275ff';
            msgDiv.innerText = "Account created! Please check your email to verify before logging in.";
            msgDiv.style.display = "block";

        } catch (error) {
            msgDiv.style.color = '#ff5c5c';
            msgDiv.innerText = error.message;
            msgDiv.style.display = "block";
        }
    };

    // Login Logic
    document.getElementById('btn-login').onclick = async () => {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const msgDiv = document.getElementById('login-message');

        try {
            const userCredential = await signInWithEmailAndPassword(auth, email, password);
            
            // Require email verification
            if (!userCredential.user.emailVerified) {
                await signOut(auth);
                msgDiv.innerText = "Please verify your email before logging in.";
                msgDiv.style.display = "block";
                return;
            }

            // Success! Go to home.
            window.location.href = 'home.html';
        } catch (error) {
            msgDiv.innerText = "Invalid credentials or email not found.";
            msgDiv.style.display = "block";
        }
    };
</script>
</body>
</html>
